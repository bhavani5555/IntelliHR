
# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/intellihr_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Document Storage Configuration
app.document.storage-location=./uploads/documents

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =====================================
# SPRING AI - GOOGLE GEMINI
# =====================================

# SPRING AI - GOOGLE GEMINI

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.8-flash

spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
# Resume Storage Configuration
app.resume.storage-location=./uploads/resumes
